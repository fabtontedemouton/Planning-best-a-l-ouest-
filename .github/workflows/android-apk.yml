name: Construire APK Android

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Préparer les fichiers web
        run: |
          mkdir -p www
          cp index.html app.js config.js style.css manifest.webmanifest icon-512.png www/
      - name: Installer Capacitor et préparer Android
        run: |
          npm init -y
          npm install @capacitor/core@7 @capacitor/android@7 @capacitor/cli@7
          npx cap add android
          npx cap sync android
      - name: Compiler l'APK debug
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: planning-best-a-l-ouest-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
