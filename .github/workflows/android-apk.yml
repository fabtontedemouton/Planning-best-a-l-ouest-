
name: Construire APK Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Preparer les fichiers
        run: |
          mkdir -p www assets
          cp index.html app.js config.js style.css manifest.webmanifest icon-512.png www/
          cp icon-only.png assets/icon-only.png
          cp splash.png assets/splash.png

      - name: Installer les dependances
        run: |
          npm install
          npm install --save-dev @capacitor/assets

      - name: Generer Android et les icones
        run: |
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android

      - name: Verifier les icones
        run: |
          test -f android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          test -f android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          test -f android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          test -f android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Compiler APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publier APK
        uses: actions/upload-artifact@v4
        with:
          name: LES-BEST-A-LOUEST-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
