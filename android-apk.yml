
name: Construire APK Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Preparer les fichiers web
        run: |
          rm -rf www android/app/src/main/res/mipmap-*
          mkdir -p www assets
          cp index.html app.js config.js style.css manifest.webmanifest icon-192.png icon-512.png www/

      - name: Installer les outils de generation
        run: |
          npm install
          npm install --no-save @capacitor/assets sharp

      - name: Ajouter la plateforme Android
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Generer les icones Android
        run: |
          node --input-type=module <<'NODE'
          import sharp from 'sharp';
          import fs from 'node:fs';

          const source = 'icon-512.png';
          const originalLogo = 'logo-best-a-l-ouest.png';
          if (!fs.existsSync(source)) throw new Error('icon-512.png introuvable');
          if (!fs.existsSync(originalLogo)) throw new Error('logo-best-a-l-ouest.png introuvable');

          // Recréer le foreground APRÈS le nettoyage du dossier assets.
          await sharp(originalLogo)
            .resize(700, 700, { fit: 'contain' })
            .png()
            .toFile('assets/icon-foreground.png');

          await sharp(source)
            .resize(1024, 1024, {
              fit: 'contain',
              background: { r: 16, g: 25, b: 20, alpha: 0 }
            })
            .png()
            .toFile('assets/icon-only.png');

          const logo = await sharp(source)
            .resize(900, 900, { fit: 'contain' })
            .png()
            .toBuffer();

          await sharp({
            create: {
              width: 2732,
              height: 2732,
              channels: 4,
              background: { r: 16, g: 25, b: 20, alpha: 1 }
            }
          })
            .composite([{ input: logo, gravity: 'centre' }])
            .png()
            .toFile('assets/splash.png');
          NODE

          npx capacitor-assets generate --android
          npx cap sync android

      - name: Forcer le logo officiel dans les icones Android
        run: |
          node --input-type=module <<'NODE'
          import sharp from 'sharp';
          import fs from 'node:fs';
          import path from 'node:path';

          const base = 'android/app/src/main/res';
          const densities = {
            mdpi: 48,
            hdpi: 72,
            xhdpi: 96,
            xxhdpi: 144,
            xxxhdpi: 192
          };

          const makeDir = p => fs.mkdirSync(p, { recursive: true });
          const logo = 'icon-512.png';
          const foreground = 'assets/icon-foreground.png';

          if (!fs.existsSync(logo) || !fs.existsSync(foreground)) {
            throw new Error('Logo officiel absent : icon-512.png ou assets/icon-foreground.png');
          }

          for (const [density, size] of Object.entries(densities)) {
            const dir = path.join(base, `mipmap-${density}`);
            makeDir(dir);
            await sharp(logo).resize(size, size, { fit: 'contain' }).png().toFile(path.join(dir, 'ic_launcher.png'));
            await sharp(logo).resize(size, size, { fit: 'contain' }).png().toFile(path.join(dir, 'ic_launcher_round.png'));
            await sharp(foreground).resize(size * 2, size * 2, { fit: 'contain' }).png().toFile(path.join(dir, 'ic_launcher_foreground.png'));
          }

          const anydpi = path.join(base, 'mipmap-anydpi-v26');
          makeDir(anydpi);
          fs.writeFileSync(path.join(anydpi, 'ic_launcher.xml'),
            '<?xml version="1.0" encoding="utf-8"?>\n<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@color/ic_launcher_background"/><foreground android:drawable="@mipmap/ic_launcher_foreground"/></adaptive-icon>');
          fs.writeFileSync(path.join(anydpi, 'ic_launcher_round.xml'),
            '<?xml version="1.0" encoding="utf-8"?>\n<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@color/ic_launcher_background"/><foreground android:drawable="@mipmap/ic_launcher_foreground"/></adaptive-icon>');

          const values = path.join(base, 'values');
          makeDir(values);
          fs.writeFileSync(path.join(values, 'ic_launcher_background.xml'),
            '<?xml version="1.0" encoding="utf-8"?>\n<resources><color name="ic_launcher_background">#09120D</color></resources>');

          const manifest = 'android/app/src/main/AndroidManifest.xml';
          if (!fs.existsSync(manifest)) throw new Error('AndroidManifest.xml introuvable');
          let xml = fs.readFileSync(manifest, 'utf8');

          // Force explicitement les deux attributs sur la balise application.
          const appTag = xml.match(/<application\b[^>]*>/s);
          if (!appTag) throw new Error('Balise <application> introuvable dans AndroidManifest.xml');
          let app = appTag[0];
          if (/android:icon=\"[^\"]+\"/.test(app)) {
            app = app.replace(/android:icon=\"[^\"]+\"/, 'android:icon=\"@mipmap/ic_launcher\"');
          } else {
            app = app.replace(/>$/, ' android:icon=\"@mipmap/ic_launcher\">');
          }
          if (/android:roundIcon=\"[^\"]+\"/.test(app)) {
            app = app.replace(/android:roundIcon=\"[^\"]+\"/, 'android:roundIcon=\"@mipmap/ic_launcher_round\"');
          } else {
            app = app.replace(/>$/, ' android:roundIcon=\"@mipmap/ic_launcher_round\">');
          }
          xml = xml.replace(appTag[0], app);
          fs.writeFileSync(manifest, xml);

          const check = fs.readFileSync(manifest, 'utf8');
          if (!check.includes('android:icon=\"@mipmap/ic_launcher\"') ||
              !check.includes('android:roundIcon=\"@mipmap/ic_launcher_round\"')) {
            throw new Error('Le manifeste Android ne référence pas les icônes Les Best à l’Ouest');
          }
          console.log('Manifeste Android : ic_launcher et ic_launcher_round forcés.');
          NODE

      - name: Verifier les icones Android
        run: |
          set -e
          test -f android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          test -f android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          test -f android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          test -f android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          test -f android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          test -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          test -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          grep -q 'android:icon="@mipmap/ic_launcher"' android/app/src/main/AndroidManifest.xml
          grep -q 'android:roundIcon="@mipmap/ic_launcher_round"' android/app/src/main/AndroidManifest.xml
          echo "OK : le manifeste pointe sur les icônes personnalisées Les Best à l’Ouest."

      - name: Compiler APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Verifier l'icone integree dans l'APK
        run: |
          set -e
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)"
          test -n "$AAPT"
          "$AAPT" dump badging "$APK" | grep -E '^(package:|application-label:|application-icon)'
          echo "APK compilé et icône déclarée dans le paquet."

      - name: Publier APK
        uses: actions/upload-artifact@v4
        with:
          name: LES-BEST-A-LOUEST-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
